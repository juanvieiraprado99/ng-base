<section class="py-4 sm:py-8">
  <h1 class="max-w-2xl text-4xl! font-bold tracking-tight sm:text-5xl!">{{ t().home.title }}</h1>
  <p class="lead max-w-2xl">{{ t().home.lead }}</p>
  <div class="mt-6 flex flex-wrap gap-3">
    <a z-button zSize="lg" [routerLink]="['/', language.lang(), 'start']">{{ t().home.ctaStart }}</a>
    <a z-button zSize="lg" zType="outline" [href]="githubUrl">{{ t().home.ctaGithub }}</a>
  </div>
</section>

<app-terminal-demo />

<section>
  <h2>{{ t().home.whyTitle }}</h2>
  <div class="grid gap-4 sm:grid-cols-2">
    @for (item of t().home.why; track item.title) {
      <z-card>
        <z-card-header>
          <z-card-title>{{ item.title }}</z-card-title>
        </z-card-header>
        <z-card-content>
          <p class="m-0" [innerHTML]="item.body | rich"></p>
        </z-card-content>
      </z-card>
    }
  </div>
</section>

<section>
  <h2>{{ t().home.filesTitle }}</h2>
  <p [innerHTML]="t().home.filesLead | rich"></p>
  <app-file-list [files]="coreFiles" />
  <p class="text-muted-foreground text-sm">{{ t().home.legend }}</p>
</section>

<section>
  <h2>{{ t().home.builtWithTitle }}</h2>
  <p [innerHTML]="t().home.builtWith | rich"></p>
  <p><a [href]="sourceUrl">{{ t().home.builtWithLink }}</a></p>
</section>
