<section class="hero">
  <h1>{{ t().home.title }}</h1>
  <p class="lead">{{ t().home.lead }}</p>
  <div class="actions">
    <a class="button" [routerLink]="['/', language.lang(), 'start']">{{ t().home.ctaStart }}</a>
    <a class="button quiet" [href]="githubUrl">{{ t().home.ctaGithub }}</a>
  </div>
</section>

<app-terminal-demo />

<section>
  <h2>{{ t().home.whyTitle }}</h2>
  <div class="why">
    @for (item of t().home.why; track item.title) {
      <div>
        <h3>{{ item.title }}</h3>
        <p [innerHTML]="item.body | rich"></p>
      </div>
    }
  </div>
</section>

<section>
  <h2>{{ t().home.filesTitle }}</h2>
  <p [innerHTML]="t().home.filesLead | rich"></p>
  <app-file-list [files]="coreFiles" />
  <p class="legend">{{ t().home.legend }}</p>
</section>

<section class="built-with">
  <h2>{{ t().home.builtWithTitle }}</h2>
  <p [innerHTML]="t().home.builtWith | rich"></p>
  <p><a [href]="sourceUrl">{{ t().home.builtWithLink }}</a></p>
</section>
