<main class="mx-auto max-w-xl px-4 py-24">
  <z-empty>
    <h1 class="text-2xl font-semibold tracking-tight">{{ t().notFound.title }}</h1>
    <p class="text-muted-foreground mt-2">{{ t().notFound.body }}</p>
    <div class="mt-6 flex flex-wrap justify-center gap-2">
      @for (lang of langs; track lang) {
        <a z-button zType="outline" [routerLink]="['/', lang]" [attr.lang]="lang">{{ t().notFound.link }} {{ names[lang] }}</a>
      }
    </div>
  </z-empty>
</main>
