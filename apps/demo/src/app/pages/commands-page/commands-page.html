<h1>{{ t().commands.title }}</h1>
<p class="lead" [innerHTML]="t().commands.lead | rich"></p>

@for (item of t().commands.items; track item.title; let i = $index) {
  <section>
    <h2><code>{{ item.title }}</code></h2>
    <p [innerHTML]="item.body | rich"></p>
    <app-code-block [code]="lines[i]" />
  </section>
}

<h2>{{ t().commands.flagsTitle }}</h2>
<p [innerHTML]="t().commands.flagsLead | rich"></p>
<div class="my-4 overflow-x-auto rounded-lg border">
  <table z-table>
    <thead z-table-header>
      <tr z-table-row>
        <th z-table-head scope="col">{{ t().commands.flagHead }}</th>
        <th z-table-head scope="col">{{ t().commands.flagDescriptionHead }}</th>
      </tr>
    </thead>
    <tbody z-table-body>
      @for (flag of flags; track flag) {
        <tr z-table-row>
          <th z-table-head scope="row"><code>{{ flag }}</code></th>
          <td z-table-cell class="whitespace-normal" [innerHTML]="t().commands.flags[flag] | rich"></td>
        </tr>
      }
    </tbody>
  </table>
</div>
