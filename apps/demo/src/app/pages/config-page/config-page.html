<h1><code>{{ t().config.title }}</code></h1>
<p class="lead" [innerHTML]="t().config.lead | rich"></p>

<div class="my-4 overflow-x-auto rounded-lg border">
  <table z-table>
    <thead z-table-header>
      <tr z-table-row>
        <th z-table-head scope="col">{{ t().config.propertyHead }}</th>
        <th z-table-head scope="col">{{ t().config.typeHead }}</th>
        <th z-table-head scope="col">{{ t().config.defaultHead }}</th>
        <th z-table-head scope="col">{{ t().config.descriptionHead }}</th>
      </tr>
    </thead>
    <tbody z-table-body>
      @for (row of rows; track row.name) {
        <tr z-table-row>
          <th z-table-head scope="row"><code>{{ row.name }}</code></th>
          <td z-table-cell class="whitespace-normal">{{ row.type }}</td>
          <td z-table-cell><code>{{ row.default }}</code></td>
          <td z-table-cell class="min-w-64 whitespace-normal" [innerHTML]="t().config.fields[row.name] | rich"></td>
        </tr>
      }
    </tbody>
  </table>
</div>
