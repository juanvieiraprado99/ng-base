<nav class="flex items-center gap-1" [attr.aria-label]="language.t().ui.language">
  @for (lang of langs; track lang) {
    <a
      z-button
      zSize="sm"
      [zType]="language.lang() === lang ? 'secondary' : 'ghost'"
      class="uppercase"
      [routerLink]="language.hrefIn(lang)"
      [attr.lang]="lang"
      [attr.hreflang]="lang"
      [attr.aria-current]="language.lang() === lang ? 'true' : null"
      [attr.aria-label]="language.t().ui.switchToLanguage + ' ' + names[lang]"
    >{{ lang }}</a>
  }
</nav>
