<ul class="m-0! ml-0! list-none! divide-y rounded-lg border font-mono text-sm" [attr.aria-label]="t().ui.files">
  @for (row of rows(); track row.dir + row.name) {
    <li class="mt-0! flex flex-wrap items-center justify-between gap-x-4 gap-y-1 px-3 py-2">
      <span class="break-all">
        <span class="text-muted-foreground">{{ row.dir }}</span><span class="font-medium">{{ row.name }}</span>
      </span>
      <z-badge [zType]="badge[row.state]">{{ t().ui.filesState[row.state] }}</z-badge>
    </li>
  }
</ul>
