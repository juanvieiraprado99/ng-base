name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: check · typecheck · test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter ngx-base-cli typecheck
      - run: pnpm --filter ngx-base-cli test
      - run: pnpm build:cli
      - name: schema.json is up to date
        run: git diff --exit-code packages/cli/schema.json

  # The docs site needs the Node version Angular 22 requires, so it is not part of the node 20 matrix.
  docs:
    name: docs site (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli
      - run: pnpm --filter demo typecheck
      - run: pnpm --filter demo test
      - run: pnpm --filter demo build

  e2e:
    name: e2e (${{ matrix.scenario }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [modern, suffixed-relative-ssr]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli
      - run: node packages/cli/scripts/e2e.mjs ${{ matrix.scenario }}
